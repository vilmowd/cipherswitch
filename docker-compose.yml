services:
  db:
    image: postgres:16-alpine
    container_name: cipherswitch-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: vaultdb
      POSTGRES_USER: vaultuser
      POSTGRES_PASSWORD: vaultpass
    volumes:
      - vault_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaultuser -d vaultdb"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cipherswitch-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://vaultuser:vaultpass@db:5432/vaultdb
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      LOG_LEVEL: INFO
      FRONTEND_URL: http://localhost:3000
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-CipherSwitch <onboarding@resend.dev>}
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8000/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 15s
    command:
      [
        "uvicorn",
        "main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cipherswitch-worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://vaultuser:vaultpass@db:5432/vaultdb
      WORKER_POLL_INTERVAL: "30"
      FRONTEND_URL: http://localhost:3000
      LOG_LEVEL: INFO
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-CipherSwitch <onboarding@resend.dev>}
      # Optional: RELEASE_WEBHOOK_URL=https://hooks.example.com/vault-triggered
    command: ["python", "worker.py"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: cipherswitch-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"

volumes:
  vault_pgdata:
